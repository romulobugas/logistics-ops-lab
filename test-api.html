<!DOCTYPE html>
<html>
<head>
    <title>Test API Direct</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 5px; }
        .result { margin-top: 20px; padding: 10px; background: #f5f5f5; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Test API Logistics Ops Lab</h1>
    
    <button onclick="testHealth()">Test Health</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testRegister()">Test Register</button>
    
    <div id="result" class="result"></div>

    <script>
        const API_BASE = 'http://localhost:3001';
        
        async function testHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                showResult('Health Check Success:', data, 'success');
            } catch (error) {
                showResult('Health Check Error:', error.message, 'error');
            }
        }
        
        async function testLogin() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'teste@logistics.com',
                        password: 'teste@123'
                    })
                });
                
                const data = await response.json();
                showResult('Login Response:', data, response.ok ? 'success' : 'error');
            } catch (error) {
                showResult('Login Error:', error.message, 'error');
            }
        }
        
        async function testRegister() {
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'novo@logistics.com',
                        username: 'novo',
                        password: 'novo123',
                        firstName: 'Novo',
                        lastName: 'Usuario'
                    })
                });
                
                const data = await response.json();
                showResult('Register Response:', data, response.ok ? 'success' : 'error');
            } catch (error) {
                showResult('Register Error:', error.message, 'error');
            }
        }
        
        function showResult(title, data, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }
    </script>
</body>
</html>
