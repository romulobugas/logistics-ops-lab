version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: logistics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistics_ops_lab
      POSTGRES_USER: logistics_user
      POSTGRES_PASSWORD: logistics_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics_user -d logistics_ops_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: logistics-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://logistics_user:logistics_password@postgres:5432/logistics_ops_lab
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  default:
    name: logistics-network
